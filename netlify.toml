# Environment variables are listed in .env.example and are set in the Netlify
# UI, not here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly: on this site the automatic install did not run, and the
# raw .next folder was published as static files, so every route 404'd.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# BrandLogo and MediaSlot check public/ with fs when a page renders on the
# server (including ISR revalidation), so those folders must ship with the
# server function, not only with the CDN assets.
[functions]
  included_files = ["public/media/**", "public/brand/**"]
